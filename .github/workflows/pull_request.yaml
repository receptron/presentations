name: Node.js CI

on:
  pull_request:
    branches:
      - main
    # Only source / config / deck changes need validation. Doc-only PRs
    # (docs/, plans/, top-level markdown) go straight to mergeable.
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '**/*.md'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - run: yarn install --frozen-lockfile --network-timeout 120000
      - run: yarn test
